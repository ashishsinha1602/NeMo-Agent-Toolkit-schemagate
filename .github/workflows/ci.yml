name: CI

on:
  push:
    branches: main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The last two toolkit minor releases, each on a supported Python.
    strategy:
      fail-fast: false
      matrix:
        include:
        - python: "3.11"
          nat: "1.8.0"
        - python: "3.13"
          nat: "1.9.0"
    name: test (Python ${{ matrix.python }}, toolkit ${{ matrix.nat }})
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install plugin and toolkit
      env:
        PYTHON: ${{ matrix.python }}
        NAT: ${{ matrix.nat }}
      run: |
        uv venv --python "$PYTHON"
        uv pip install ".[test]" "nvidia-nat-core==$NAT" "nvidia-nat-test==$NAT"

    # Asks the registry directly rather than parsing the `nat info components` table.
    - name: Check the toolkit discovers the plugin
      run: |
        uv run --no-sync python -c "
        from nat.cli.type_registry import GlobalTypeRegistry
        from nat.runtime.loader import PluginTypes, discover_and_register_plugins
        from nemo_agent_toolkit_schemagate.functions import SchemagateFunctionGroupConfig
        from nemo_agent_toolkit_schemagate.retriever import SchemagateRetrieverConfig
        discover_and_register_plugins(PluginTypes.ALL)
        GlobalTypeRegistry.get().get_function_group(SchemagateFunctionGroupConfig)
        GlobalTypeRegistry.get().get_retriever_provider(SchemagateRetrieverConfig)
        print('schemagate function group and retriever are registered')
        "

    - name: Run unit and loader tests
      run: uv run --no-sync pytest -v
