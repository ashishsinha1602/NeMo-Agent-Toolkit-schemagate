[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_agent_toolkit_schemagate"]

[project]
name = "nemo-agent-toolkit-schemagate"
version = "0.1.0"
description = "schemagate schema selection for NVIDIA NeMo Agent Toolkit: only the tables a question needs, only the ones the caller may read"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Ashish Sinha" }]
keywords = ["nemo", "nvidia", "agents", "text-to-sql", "schema", "access-control", "schemagate"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "nvidia-nat-core>=1.8,<2",
  "schemagate>=1.15.1,<2",
]

[project.optional-dependencies]
test = [
  "nvidia-nat-test>=1.8,<2",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.urls]
documentation = "https://github.com/ashishsinha1602/NeMo-Agent-Toolkit-schemagate#readme"
source = "https://github.com/ashishsinha1602/NeMo-Agent-Toolkit-schemagate"
issues = "https://github.com/ashishsinha1602/NeMo-Agent-Toolkit-schemagate/issues"
schemagate = "https://github.com/ashishsinha1602/schemagate"

[project.entry-points."nat.plugins"]
nat_schemagate = "nemo_agent_toolkit_schemagate.register"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-single-line = true
